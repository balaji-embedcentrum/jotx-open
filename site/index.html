<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jotx: notes that live in your repo</title>
  <meta name="description" content="jotx is a block editor for plain-text notes in VS Code, and a one-line script that shows .jot files on any website.">
  <link rel="icon" href="assets/logo-jotx.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
  <script src="embed/jotx.min.js" defer></script>
</head>
<body>
  <!-- The whole website is site/jotx.jot: its tabs are the navigation -->
  <main class="site">
    <jotx-doc src="jotx.jot"><p class="boot">Loading…</p></jotx-doc>
  </main>
  <footer class="foot">Apache-2.0 · <a href="https://github.com/balaji-embedcentrum/jotx-open">jotx on GitHub</a></footer>
  <script>
    // If jotx.min.js cannot start (blocked, failed to download, or an unsupported browser), say so instead of showing an empty page
    (function () {
      var problem = ''
      addEventListener('error', function (e) {
        if (!(window.customElements && customElements.get('jotx-doc'))) problem = e.message || 'the script could not be downloaded'
      }, true)
      addEventListener('load', function () {
        setTimeout(function () {
          if (window.customElements && customElements.get('jotx-doc')) return
          var text = 'jotx could not start in this browser' + (problem ? ': ' + problem.replace(/\.?$/, '.') : '.') + ' Try reloading, or open the page in another browser.'
          document.querySelectorAll('jotx-doc').forEach(function (el) {
            var p = document.createElement('p'); p.className = 'boot is-error'; p.textContent = text
            el.replaceChildren(p)
          })
        }, 1500)
      })
    })()
  </script>
</body>
</html>
