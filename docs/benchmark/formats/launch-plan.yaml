title: Atlas 2.0 Launch Plan
blocks:
  - heading: Atlas 2.0 Launch Plan
    level: 1
  - paragraph: >-
      Everything the team needs to ship Atlas 2.0 on **December 1**: scope, owners, risks, and the path from beta to
      general availability.
  - table:
      columns:
        - Key
        - Value
      rows:
        - - Owner
          - Priya Raman
        - - Status
          - On track
        - - Target date
          - '2026-12-01'
  - callout: Scope is frozen as of **October 20**. New requests go to the 2.1 backlog.
    variant: info
  - heading: Goals
    level: 2
  - list:
      - Cut cold-start time from 2.4s to under **800ms**
      - Ship offline sync to every paid workspace
      - Reach 99.95% API availability for 30 days before GA
  - heading: Workstreams
    level: 2
  - progress:
      title: Workstream progress
      items:
        - label: Sync engine
          value: 82
        - label: Desktop app
          value: 64
        - label: Migration tooling
          value: 7
          max: 12
        - label: Docs & onboarding
          value: 40
  - kanban:
      title: Launch board
      columns:
        - title: Todo
          cards:
            - Pricing page copy
            - Status page alerts
        - title: In progress
          cards:
            - Offline conflict resolver
            - Migration dry run
        - title: Review
          cards:
            - SSO for enterprise
        - title: Done
          cards:
            - Load test at 5x traffic
  - heading: Timeline
    level: 2
  - timeline:
      title: Milestones
      events:
        - date: '2026-09-15'
          title: Private beta
          status: done
          detail: 40 design partners
        - date: '2026-10-20'
          title: Scope freeze
          status: done
        - date: '2026-11-10'
          title: Public beta
          status: active
          detail: Feature flags on for 20% of workspaces
        - date: '2026-12-01'
          title: General availability
          status: planned
        - date: '2027-01-15'
          title: 2.1 release
          status: planned
  - heading: Architecture
    level: 2
  - mermaid: |-
      flowchart LR
        Client[Desktop client] --> Queue[(Change queue)]
        Queue --> Resolver{Conflict resolver}
        Resolver -->|clean| Store[(Primary store)]
        Resolver -->|conflict| Review[Manual review]
    title: Sync flow
  - code: |-
      atlas migrate --workspace acme --dry-run
      atlas migrate --workspace acme --apply
    language: bash
  - heading: Beta metrics
    level: 2
  - chart:
      title: Weekly active workspaces
      type: bar
      labels:
        - W1
        - W2
        - W3
        - W4
      datasets:
        - label: Workspaces
          data:
            - 120
            - 210
            - 340
            - 480
  - table:
      columns:
        - Risk
        - Impact
        - Owner
        - Mitigation
      rows:
        - - Sync data loss
          - High
          - Marco
          - Write-ahead log + nightly restore drill
        - - Migration timeouts
          - Medium
          - Lena
          - Batch by workspace size
        - - Pricing confusion
          - Low
          - Priya
          - Comparison table on pricing page
  - heading: Decisions
    level: 2
  - decision:
      title: Use CRDTs for offline sync
      status: accepted
      date: '2026-08-04'
      context: Last-write-wins lost edits in 3% of beta sessions.
      decision: Adopt CRDT-based merge for documents and comments.
      consequences: Larger payloads (~15%), but no silent data loss.
  - heading: Launch checklist
    level: 2
  - checklist:
      - text: Security review signed off
        done: false
      - text: Load test at 5x expected traffic
        done: false
      - text: Support playbook published
        done: false
      - text: Press kit and launch post ready
        done: false
