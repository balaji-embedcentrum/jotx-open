name: Bug report
description: Something in jotx does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: jot
    attributes:
      label: The .jot text
      description: The smallest piece of a .jot file that shows the problem. Remove anything private.
      render: text
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - VS Code editor
        - VS Code text view (highlighting, completions, diagnostics)
        - "<jotx-doc> on a web page"
        - CLI
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: jotx version, and VS Code version or browser
      placeholder: jotx 3.2.0, VS Code 1.105, macOS
