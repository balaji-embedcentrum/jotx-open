name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build every package and the extension
        run: npm run build
      - name: Build the web embed
        run: npm run build:embed
      - name: Test
        run: npm test
      - name: Validate every shipped .jot file
        run: |
          find jotx-help site docs packages/cli/examples -name '*.jot' -print0 |
            xargs -0 -n1 node packages/cli/dist/cli.js validate > /dev/null
      - name: Shipped .jot files use compact syntax
        run: node packages/cli/dist/cli.js migrate jotx-help site packages/cli/examples --to compact --check
      - name: Build the example site
        run: |
          node packages/cli/dist/cli.js site build packages/cli/examples/site --out "$RUNNER_TEMP/example-site"
          test -f "$RUNNER_TEMP/example-site/guides/requirements/index.html"
          test -f "$RUNNER_TEMP/example-site/pagefind/pagefind-ui.js"
